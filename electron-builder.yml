appId: com.example.electron-mpv-player
productName: ElectronMPVPlayer

directories:
  output: release          # ← 关键修改：从 dist 改为 release
  buildResources: build

files:
  - "**/*"
  - "!.libmpv/**/*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/.cache"
  - "!**/*.ts"
  - "!**/*.map"

asar: true

asarUnpack:
  - "**/node_modules/electron-mpv-video/**"
  - "**/*.node"

extraResources:
  - from: ".libmpv/bin/libmpv-2.dll"
    to: "libmpv/libmpv-2.dll"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
